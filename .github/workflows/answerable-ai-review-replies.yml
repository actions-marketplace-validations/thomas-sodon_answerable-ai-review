name: Answerable AI Review

on:
  # Re-check reply coverage when someone replies to (or reviews) a finding,
  # so the gate turns green without another push. Kept apart from
  # answerable-ai-review.yml so these runs add no skipped "review" check.
  pull_request_review_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Same job name as the push-triggered gate, so it updates the same check.
  replies:
    runs-on: ubuntu-latest
    # A review with comments fires pull_request_review and
    # pull_request_review_comment at once, and each reports its own check.
    # Group by event so one event's run never cancels the other's, and let
    # running jobs finish: a cancelled required check blocks the merge.
    concurrency:
      group: answerable-replies-${{ github.event.pull_request.number }}-${{ github.event_name }}
    steps:
      - name: Reply coverage
        uses: thomas-sodon/answerable-ai-review@ab20bdb0dbf2aa5b132ff1f4195e509331587645 # v0.1.0
        with:
          mode: replies
