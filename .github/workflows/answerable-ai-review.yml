name: Answerable AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Replies to findings re-run the gate from answerable-ai-review-replies.yml,
  # so they don't add a skipped "review" check to the PR.

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Review the diff with Claude, post findings, and resolve threads whose
  # defect is fixed. Skipped on fork PRs, which get neither repository secrets
  # nor a write token.
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # One review per PR at a time; a newer push cancels an older review.
    concurrency:
      group: answerable-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Review
        uses: thomas-sodon/answerable-ai-review@ab20bdb0dbf2aa5b132ff1f4195e509331587645 # v0.1.0
        with:
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Fail while any finding is still unanswered (no Claude call, no credential).
  # Runs after the review so threads it resolved as fixed count as answered,
  # and runs whether the review passed, failed or was skipped, but not when the
  # review was cancelled by a newer push.
  replies:
    needs: review
    if: ${{ !cancelled() && needs.review.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # Replies use their own group (answerable-ai-review-replies.yml), so a
    # reply never cancels the gate a push's review is waiting on.
    concurrency:
      group: answerable-replies-${{ github.event.pull_request.number }}-push
      cancel-in-progress: true
    steps:
      - name: Reply coverage
        uses: thomas-sodon/answerable-ai-review@ab20bdb0dbf2aa5b132ff1f4195e509331587645 # v0.1.0
        with:
          mode: replies
