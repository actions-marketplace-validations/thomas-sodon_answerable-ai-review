name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'metronome' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      # Lint and type-check once: the results do not depend on the runtime
      # Python (mypy already targets 3.11 via pyproject).
      - name: Ruff
        if: matrix.python-version == '3.14'
        run: python -m ruff check src/ tests/
      - name: Mypy
        if: matrix.python-version == '3.14'
        run: python -m mypy src/
      - name: Pytest
        run: python -m pytest tests/ -v

  # Publish a release when a merge to main carries a version that has no tag
  # yet: tag vX.Y.Z, create the GitHub release, and move the vX major tag that
  # users reference (@v0). A merge that leaves the version unchanged is a no-op,
  # so bump the version in pyproject.toml and src/answerable/__init__.py in the
  # PR that should ship.
  release:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Read version
        id: version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          module=$(python -c 'import ast, pathlib; tree = ast.parse(pathlib.Path("src/answerable/__init__.py").read_text()); print(next(n.value.value for n in tree.body if isinstance(n, ast.Assign) and n.targets[0].id == "__version__"))')
          if [ "$version" != "$module" ]; then
            echo "::error::pyproject.toml version ($version) does not match __version__ ($module)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=v${version%%.*}" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "::notice::$TAG already exists; nothing to release"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$MAJOR" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$MAJOR" -f sha="$GITHUB_SHA" -F force=true --silent
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$MAJOR" -f sha="$GITHUB_SHA" --silent
          fi
          echo "::notice::Released $TAG and moved $MAJOR to $GITHUB_SHA"
